databases:
  - name: resolveai-db
    databaseName: resolveai
    user: resolveai
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: resolveai-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: resolveai-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: resolveai-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: resolveai-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: resolveai-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: resolveai-db
          property: password
      - key: CORS_ORIGIN
        sync: false
      - key: KB_INGEST
        value: "true"