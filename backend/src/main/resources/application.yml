spring:
  application:
    name: resolveai
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resolveai}}
    username: ${DB_USER:kavaykhurana}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:dummy-key-for-local-boot}
        chat:
          options:
            model: gemini-2.5-flash
        embedding:
          api-key: ${GEMINI_API_KEY:dummy-key-for-local-boot}
          text:
            options:
              model: text-embedding-004
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-in-production-0123456789abcdef}
    expiration-ms: 86400000
  cors:
    origin: ${CORS_ORIGIN:http://localhost:5173}
  kb:
    ingest-enabled: ${KB_INGEST:true}

logging:
  level:
    com.resolveai: INFO